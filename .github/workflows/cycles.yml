# Builds Blender's Cycles renderer (Apache-2.0) as a standalone program for Akshara's cinematic
# 3D render, and attaches the builds to a "cycles-<version>" release in this repository.
# Windows: CPU + NVIDIA CUDA (precompiled kernels) + OptiX. macOS (Apple Silicon): CPU + Metal.
name: Build Cycles

on:
  workflow_dispatch:
    inputs:
      version:
        description: Cycles tag (projects.blender.org/blender/cycles)
        default: v5.2.0
      cuda_arch:
        description: NVIDIA GPU generations to precompile (RTX 20 / 30 / 40 / 50 + PTX fallback)
        default: sm_75;sm_86;sm_89;sm_120;compute_75

permissions:
  contents: write

env:
  COMMON_OPTIONS: >-
    -DWITH_CYCLES_OSL=OFF -DWITH_CYCLES_USD=OFF -DWITH_CYCLES_HYDRA_RENDER_DELEGATE=OFF
    -DWITH_CYCLES_ALEMBIC=OFF -DWITH_CYCLES_OPENVDB=OFF -DWITH_CYCLES_NANOVDB=OFF
    -DWITH_CYCLES_STANDALONE_GUI=OFF -DWITH_CYCLES_EMBREE=ON -DWITH_CYCLES_OPENIMAGEDENOISE=ON
    -DWITH_CYCLES_PUGIXML=ON -DCMAKE_BUILD_TYPE=Release

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Disk space
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.8.1'
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration", "nvrtc_dev", "cuda_profiler_api"]'

      - name: Cycles source and libraries
        shell: pwsh
        run: |
          git lfs install
          git clone --depth 1 --branch "${{ inputs.version }}" https://projects.blender.org/blender/cycles.git D:\cy
          git clone --depth 1 --branch v8.0.0 https://github.com/NVIDIA/optix-dev.git D:\optix
          cd D:\cy
          python src/cmake/make_update.py
          Get-PSDrive D | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Configure
        shell: pwsh
        run: >
          cmake -S D:\cy -B D:\build -G "Visual Studio 17 2022" -A x64 $env:COMMON_OPTIONS.Split(' ')
          -DWITH_CYCLES_DEVICE_CUDA=ON -DWITH_CYCLES_CUDA_BINARIES=ON "-DCYCLES_CUDA_BINARIES_ARCH=${{ inputs.cuda_arch }}"
          -DWITH_CYCLES_DEVICE_OPTIX=ON -DOPTIX_ROOT_DIR=D:/optix
          -DWITH_CYCLES_DEVICE_HIP=OFF -DWITH_CYCLES_DEVICE_ONEAPI=OFF
          -DCMAKE_INSTALL_PREFIX=D:/install

      - name: Build
        run: cmake --build D:\build --config Release --target install -- /m /v:minimal

      - name: Smoke test (CPU render of an example scene)
        shell: pwsh
        run: |
          $exe = Get-ChildItem D:\install -Recurse -Filter cycles.exe | Select-Object -First 1
          & $exe.FullName --list-devices
          & $exe.FullName --background --samples 8 --width 320 --height 240 --output D:\smoke.png D:\cy\examples\scene_monkey.xml
          if (!(Test-Path D:\smoke.png)) { throw "smoke render produced no image" }
          (Get-Item D:\smoke.png).Length

      - name: Package
        shell: pwsh
        run: |
          Copy-Item D:\smoke.png D:\install\smoke-test.png
          Copy-Item D:\cy\LICENSE D:\install\LICENSE-cycles.txt
          Compress-Archive -Path D:\install\* -DestinationPath D:\cycles-${{ inputs.version }}-win-x64.zip
          (Get-Item D:\cycles-${{ inputs.version }}-win-x64.zip).Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cycles-win-x64
          path: D:\cycles-${{ inputs.version }}-win-x64.zip

  macos:
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - name: Cycles source and libraries
        run: |
          git lfs install
          git clone --depth 1 --branch "${{ inputs.version }}" https://projects.blender.org/blender/cycles.git "$RUNNER_TEMP/cy"
          cd "$RUNNER_TEMP/cy"
          python3 src/cmake/make_update.py
          df -h .

      - name: Configure
        run: >
          cmake -S "$RUNNER_TEMP/cy" -B "$RUNNER_TEMP/build" -G Xcode $COMMON_OPTIONS
          -DWITH_CYCLES_DEVICE_METAL=ON -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/install"

      - name: Build
        run: cmake --build "$RUNNER_TEMP/build" --config Release --target install -- -quiet

      - name: Smoke test (CPU render of an example scene)
        run: |
          exe=$(find "$RUNNER_TEMP/install" -type f -name cycles -perm -u+x | head -1)
          "$exe" --list-devices
          "$exe" --background --samples 8 --width 320 --height 240 --output "$RUNNER_TEMP/smoke.png" "$RUNNER_TEMP/cy/examples/scene_monkey.xml"
          test -f "$RUNNER_TEMP/smoke.png"

      - name: Package
        run: |
          cp "$RUNNER_TEMP/smoke.png" "$RUNNER_TEMP/install/smoke-test.png"
          cp "$RUNNER_TEMP/cy/LICENSE" "$RUNNER_TEMP/install/LICENSE-cycles.txt"
          cd "$RUNNER_TEMP/install" && zip -qry "$RUNNER_TEMP/cycles-${{ inputs.version }}-macos-arm64.zip" .
          ls -la "$RUNNER_TEMP"/cycles-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cycles-macos-arm64
          path: ${{ runner.temp }}/cycles-${{ inputs.version }}-macos-arm64.zip

  release:
    needs: [windows, macos]
    if: always() && (needs.windows.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          tag="cycles-${{ inputs.version }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Cycles ${{ inputs.version }} for Akshara" --prerelease \
              --notes "Blender's Cycles renderer (Apache-2.0), built standalone for Akshara's cinematic 3D render. Source: https://projects.blender.org/blender/cycles"
          gh release upload "$tag" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
